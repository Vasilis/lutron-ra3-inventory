name: Release

# Builds a macOS .dmg + .app.zip on every ``v*`` tag and uploads them to
# the GitHub release page. Ad-hoc signed only — the resulting bundle will
# trip Gatekeeper on user machines until a real Developer ID identity is
# wired in (see docs/packaging-macos.md). The artifacts are still useful
# for power users who can right-click → Open.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required for gh release upload

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Copy frontend bundle into backend static dir
        run: bash scripts/copy-frontend-dist.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install build deps
        working-directory: backend
        run: python -m pip install -e ".[build]"

      # See .github/workflows/ci.yml for the proxy_tools-has-no-wheel
      # explanation; same workaround applies here.
      - name: Pre-build proxy_tools wheel (no upstream wheel on PyPI)
        run: |
          mkdir -p "${{ github.workspace }}/wheels"
          python -m pip wheel proxy-tools -w "${{ github.workspace }}/wheels"

      - name: Briefcase package (ad-hoc signed)
        working-directory: backend
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
        run: briefcase package macOS --no-input --adhoc-sign

      - name: Locate artifacts
        id: artifacts
        working-directory: backend
        run: |
          dmg="$(find dist -maxdepth 2 -name '*.dmg' | head -1)"
          app="$(find build -maxdepth 4 -name '*.app' -print -quit)"
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          if [ -z "$dmg" ]; then echo "::error::no .dmg produced"; exit 1; fi
          if [ -z "$app" ]; then echo "::error::no .app produced"; exit 1; fi
          echo "Found:"
          echo "  $dmg"
          echo "  $app"

      - name: Zip the .app bundle
        working-directory: backend
        run: |
          appdir="${{ steps.artifacts.outputs.app }}"
          zipname="$(basename "$appdir").zip"
          ditto -c -k --sequesterRsrc --keepParent "$appdir" "$zipname"
          echo "zip=$zipname" >> "$GITHUB_OUTPUT"
        id: zip

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: backend
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "$tag" \
            "${{ steps.artifacts.outputs.dmg }}" \
            "${{ steps.zip.outputs.zip }}" \
            --clobber
